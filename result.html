<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Текст заявки//Фитаревская 15к2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
  background:#2a2420;
  color:#fff;
  min-height:100vh;
  padding:20px;
}
.page-title{
  font-size:28px;
  font-weight:700;
  margin-bottom:20px;
  padding:0 10px;
}
.card{
  max-width:600px;
  margin:0 auto;
  background:#1e1a16;
  border-radius:16px;
  padding:30px 25px;
}
.info{
  font-size:14px;
  color:#b0a8a0;
  margin-bottom:20px;
  line-height:1.6;
}
.info b{color:#ff9800}
.text-box{
  background:#2a2420;
  border:1px solid #4a4540;
  border-radius:10px;
  padding:18px;
  font-size:15px;
  line-height:1.6;
  white-space:pre-wrap;
  margin-bottom:20px;
  color:#f0ece8;
}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  flex:1;
  min-width:140px;
  padding:14px;
  border:none;
  border-radius:10px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:background .15s;
}
.btn-copy{background:#4caf50;color:#fff}
.btn-copy:hover{background:#66bb6a}
.btn-back{background:#ff9800;color:#1a1410}
.btn-back:hover{background:#ffb74d}
</style>
</head>
<body>

<h1 class="page-title">Текст заявки//Фитаревская 15к2</h1>

<div class="card">
  <div class="info" id="info"></div>
  <div class="text-box" id="textBox"></div>
  <div class="btn-row">
    <button class="btn btn-copy" onclick="copyText()">📋 Скопировать текст</button>
    <button class="btn btn-back" onclick="history.back()">← Назад</button>
  </div>
</div>

<script>
// === СЛОВАРЬ ТЕКСТОВ ===
const TEXTS = {
  gvs_uk:`В квартире №{APT} по адресу: г. Москва, ул. Фитаревская, д. 15, корп. 2, наблюдается протечка горячего водоснабжения (ГВС).

Прошу работников УК ГБУ «Жилищник района Коммунарка» срочно устранить проблему.

Дата обращения: {DATE}`,

  gvs_gzhi:`Прошу срочно принять меры по бездействию работников УК ГБУ «Жилищник района Коммунарка».

По квартире №{APT} (г. Москва, ул. Фитаревская, д. 15, корп. 2) была подана заявка на устранение протечки ГВС, однако инцидент не устраняется в установленный срок.

Прошу провести проверку и выдать предписание об устранении нарушения.

Дата обращения: {DATE}`,

  gvs_uprava:`Прошу оказать содействие в устранении протечки горячего водоснабжения (ГВС) в квартире №{APT} по адресу: г. Москва, ул. Фитаревская, д. 15, корп. 2.

Прошу направить запрос в УК ГБУ «Жилищник района Коммунарка» для устранения проблемы.

Дата обращения: {DATE}`,

  hvs_uk:`В квартире №{APT} по адресу: г. Москва, ул. Фитаревская, д. 15, корп. 2, наблюдается протечка холодного водоснабжения (ХВС).

Прошу работников УК ГБУ «Жилищник района Коммунарка» срочно устранить проблему.

Дата обращения: {DATE}`,

  hvs_gzhi:`Прошу срочно принять меры по бездействию работников УК ГБУ «Жилищник района Коммунарка».

По квартире №{APT} (г. Москва, ул. Фитаревская, д. 15, корп. 2) была подана заявка на устранение протечки ХВС, однако инцидент не устраняется в установленный срок.

Прошу провести проверку и выдать предписание об устранении нарушения.

Дата обращения: {DATE}`,

  hvs_uprava:`Прошу оказать содействие в устранении протечки холодного водоснабжения (ХВС) в квартире №{APT} по адресу: г. Москва, ул. Фитаревская, д. 15, корп. 2.

Прошу направить запрос в УК ГБУ «Жилищник района Коммунарка» для устранения проблемы.

Дата обращения: {DATE}`,

  heating_uk:`В квартире №{APT} по адресу: г. Москва, ул. Фитаревская, д. 15, корп. 2, наблюдается проблема с отоплением: батареи не греют / недостаточно греют.

Прошу работников УК ГБУ «Жилищник района Коммунарка» срочно устранить проблему. Температура в помещении должна соответствовать нормативным требованиям (не ниже +18°C, в угловых комнатах не ниже +20°C согласно Постановлению Правительства РФ №354).

Дата обращения: {DATE}`,

  heating_gzhi:`Прошу срочно принять меры по бездействию работников УК ГБУ «Жилищник района Коммунарка».

По квартире №{APT} (г. Москва, ул. Фитаревская, д. 15, корп. 2) была подана заявка по проблеме с отоплением, однако инцидент не устраняется в установленный срок. Температура в помещении не соответствует нормативным требованиям.

Прошу провести проверку и выдать предписание об устранении нарушения.

Дата обращения: {DATE}`,

  heating_uprava:`Прошу оказать содействие в решении проблемы с отоплением в квартире №{APT} по адресу: г. Москва, ул. Фитаревская, д. 15, корп. 2.

Прошу направить запрос в УК ГБУ «Жилищник района Коммунарка» для устранения нарушения нормативных требований по температуре в жилом помещении.

Дата обращения: {DATE}`,

  garbage_uk:`В подъезде дома по адресу: г. Москва, ул. Фитаревская, д. 15, корп. 2, забит мусоропровод. Мусор не уходит, создаётся антисанитарная обстановка.

Прошу работников УК ГБУ «Жилищник района Коммунарка» срочно устранить проблему.

Дата обращения: {DATE}`,

  garbage_gzhi:`Прошу срочно принять меры по бездействию работников УК ГБУ «Жилищник района Коммунарка».

По адресу: г. Москва, ул. Фитаревская, д. 15, корп. 2, была подана заявка по факту засора мусоропровода, однако инцидент не устраняется в установленный срок. Создаётся антисанитарная обстановка.

Прошу провести проверку и выдать предписание об устранении нарушения.

Дата обращения: {DATE}`,

  garbage_uprava:`Прошу оказать содействие в устранении засора мусоропровода в доме по адресу: г. Москва, ул. Фитаревская, д. 15, корп. 2.

Прошу направить запрос в УК ГБУ «Жилищник района Коммунарка» для устранения проблемы.

Дата обращения: {DATE}`,

  cleaning_uk:`В подъезде дома по адресу: г. Москва, ул. Фитаревская, д. 15, корп. 2, не проводилась уборка на этаже. Нарушаются Правила и нормы технической эксплуатации жилищного фонда (Постановление Госстроя РФ №170 от 27.09.2003).

Прошу работников УК ГБУ «Жилищник района Коммунарка» срочно устранить проблему.

Дата обращения: {DATE}`,

  cleaning_gzhi:`Прошу срочно принять меры по бездействию работников УК ГБУ «Жилищник района Коммунарка».

По адресу: г. Москва, ул. Фитаревская, д. 15, корп. 2, была подана заявка по факту неуборки этажа, однако инцидент не устраняется в установленный срок.

Прошу провести проверку и выдать предписание об устранении нарушения.

Дата обращения: {DATE}`,

  cleaning_uprava:`Прошу оказать содействие в организации уборки этажа в доме по адресу: г. Москва, ул. Фитаревская, д. 15, корп. 2.

Прошу направить запрос в УК ГБУ «Жилищник района Коммунарка» для устранения нарушения.

Дата обращения: {DATE}`
};

const NAMES = {
  gvs:'Протечка ГВС',
  hvs:'Протечка ХВС',
  heating:'Проблема с отоплением',
  garbage:'Забит мусоропровод',
  cleaning:'Не проводилась уборка на этаже'
};
const REC_NAMES = {
  uk:'ГБУ «Жилищник района Коммунарка»',
  gzhi:'Государственная жилищная инспекция города Москвы',
  uprava:'Управа района Коммунарка города Москвы'
};

const params = new URLSearchParams(window.location.search);
const apt = params.get('apt');
const problem = params.get('problem');
const recipient = params.get('recipient');

if(!apt || !problem || !recipient){
  document.getElementById('textBox').textContent = 'Ошибка: не переданы параметры. Вернитесь назад и заполните форму.';
} else {
  const key = problem + '_' + recipient;
  let text = TEXTS[key];
  if(!text) text = 'Текст для этой комбинации не найден.';

  const date = new Date().toLocaleDateString('ru-RU');
  text = text.replace(/{APT}/g, apt).replace(/{DATE}/g, date);

  document.getElementById('info').innerHTML =
    '<b>Квартира:</b> №' + apt + '<br>' +
    '<b>Проблема:</b> ' + NAMES[problem] + '<br>' +
    '<b>Адресат:</b> ' + REC_NAMES[recipient] + '<br>' +
    '<b>Дата:</b> ' + date;

  document.getElementById('textBox').textContent = text;
}

function copyText(){
  const text = document.getElementById('textBox').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    alert('Текст скопирован! Теперь вставьте его в ГИС ЖКХ, электронную почту или распечатайте.');
  }).catch(()=>{
    // Fallback для старых браузеров
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('Текст скопирован!');
  });
}
</script>
</body>
</html>
